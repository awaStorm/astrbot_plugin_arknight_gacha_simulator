name: astrbot_plugin_arknight_gacha_simulator
display_name: Arknight Gacha Simulator
short_desc: 明日方舟抽卡模拟器 - 卡池查询、抽卡模拟、签到系统、潜能仓库
desc: |
  忠实还原明日方舟抽卡机制的 AstrBot 抽卡模拟器插件。

  功能：
  - 多卡池并行：标准 / 限定 / 中坚 / 联动 / 定向甄选 / 新人特惠 / 跨年欢庆等全部池型
  - 单抽 / 十连：在指定卡池抽卡，支持 6★ 软保底、10 连保底 5★、UP 干员比例等真实概率机制
  - 每日签到：每日签到领取抽卡次数
  - 卡池查询：查看当前进行中卡池的 UP 干员、开启/结束时间、池型标签
  - 潜能仓库：记录已获干员与潜能数，支持按星级分页查看
  - 结果图片渲染：合成带光效、光晕、星点着色的抽卡结果图
  - 自动数据更新：数据通过 tools/ 目录下脚本从 PRTS Wiki 与官方 gacha_table.json 自动同步

  抽卡次数、签到记录、潜能仓库数据均持久化于独立 SQLite 数据库，多用户数据隔离。
version: v0.2.2
author: awaStorm
repo: https://github.com/awaStorm/astrbot_plugin_arknight_gacha_simulator
astrbot_version: ">=4.16"
support_platforms:
